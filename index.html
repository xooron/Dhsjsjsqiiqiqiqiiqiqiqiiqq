            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- СТИЛЬ СТЕКЛА (GLASSMORPHISM) --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* --- ПАНЕЛЬКИ (КАРТОЧКИ) --- */
        .bonus-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .bonus-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s;
        }

        .bonus-card:hover::before {
            left: 100%;
        }

        .bonus-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }

        .bonus-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-grow: 1;
        }

        /* Логотипы в кругах */
        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .brand-icon.panda { background: rgba(0, 200, 100, 0.2); color: #00ff88; }
        .brand-icon.monkey { background: rgba(255, 120, 0, 0.2); color: #ffaa00; }
        .brand-icon.apex { background: rgba(100, 150, 255, 0.2); color: #66aaff; }
        .brand-icon.hotskins { background: rgba(255, 60, 200, 0.2); color: #ff33c8; }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: #e0e0e0;
        }

        /* Кнопка "Получить Бонус" */
        .bonus-btn {
            background: linear-gradient(90deg, #50ff88, #00aa55);
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 200, 100, 0.3);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .bonus-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 200, 100, 0.4);
        }

        .bonus-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(0, 200, 100, 0.3);
        }

        .bonus-btn::after {
            content: '➜';
            position: absolute;
            right: 15px;
            transition: right 0.3s ease;
        }

        .bonus-btn:hover::after {
            right: 10px;
        }

        /* --- Заголовок --- */
        .app-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            position: relative;
            padding-bottom: 10px;
        }

        .app-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, #50ff88, #00aa55);
            border-radius: 1px;
        }
    </style>
