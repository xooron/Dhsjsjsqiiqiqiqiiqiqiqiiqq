<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Casino Bonus</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text-main: #ffffff;
            --text-orange: #ff6c00;
            --panel-yellow: #fcd34d;
            --panel-green: #22c55e;
            --panel-bg: #181818;
            --border: #333333;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: var(--text-orange);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-orange), transparent);
            margin: 15px 0;
            width: 100%;
        }

        .bonus-label {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card.in-view {
            transform: translateY(0);
            opacity: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--panel-yellow), var(--panel-green));
        }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 140px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            font-weight: 700;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .stat-yellow {
            background-color: rgba(252, 211, 77, 0.15);
            color: var(--panel-yellow);
        }

        .stat-green {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--panel-green);
        }

        .stat-value {
            display: block;
            font-size: 20px;
            margin-top: 5px;
        }

        @media (min-width: 600px) {
            .container {
                flex-direction: row;
            }
            .card {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">Casino <span>Bonus</span></div>
        <div class="divider"></div>
        <div class="bonus-label">BONUS</div>
    </header>

    <main class="container">
        <div class="card" id="card1">
            <div class="card-title">PANDA</div>
            <div class="stats">
                <div class="stat-box stat-yellow">
                    <span>FS</span>
                    <span class="stat-value">1500</span>
                </div>
                <div class="stat-box stat-green">
                    <span>Bonus</span>
                    <span class="stat-value">225%</span>
                </div>
            </div>
        </div>

        <div class="card" id="card2">
            <div class="card-title">JETTON</div>
            <div class="stats">
                <div class="stat-box stat-yellow">
                    <span>FS</span>
                    <span class="stat-value">250</span>
                </div>
                <div class="stat-box stat-green">
                    <span>Bonus</span>
                    <span class="stat-value">425%</span>
                </div>
            </div>
        </div>

        <div class="card" id="card3">
            <div class="card-title">APEX</div>
            <div class="stats">
                <div class="stat-box stat-yellow">
                    <span>FS</span>
                    <span class="stat-value">900</span>
                </div>
                <div class="stat-box stat-green">
                    <span>Bonus</span>
                    <span class="stat-value">225%</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Анимация появления карточек при скролле
        const observerOptions = {
            threshold: 0.3,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in-view');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.card').forEach(card => {
            observer.observe(card);
        });

        // Автоматическая активация первой карточки при загрузке (для красоты)
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('card1').classList.add('in-view');
            }, 100);
        });
    </script>

</body>
</html>
