<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BONUS CASINO</title>
    <!-- Подключаем официальный SDK Telegram для инициализации WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Темно-темно-синий фон, как вы просили */
            --bg-color: rgba(5, 10, 30, 0.85);
            --panel-bg: rgba(10, 20, 50, 0.4);
            --glass-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --accent-gradient: linear-gradient(135deg, #00e5ff, #8e2de2);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0f2a, #1a051e);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Инициализация Telegram WebApp (убирает стандартные поля мессенджера) */
        body.telegram-app-ready {
            background: var(--bg-color);
        }

        /* Верхняя панель */
        .header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .header-sub {
            font-size: 13px;
            padding: 6px 12px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            backdrop-filter: blur(15px);
            box-shadow: var(--shadow);
        }

        /* Основной контейнер */
        .container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Стеклянные панельки с играми */
        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--glass-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .game-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.8s;
        }

        .game-panel:hover::before {
            left: 100%;
        }

        .game-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(142, 45, 226, 0.25);
        }

        .game-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .bonus-btn {
            padding: 10px 20px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(142, 45, 226, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        .bonus-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(142, 45, 226, 0.3);
        }

        /* Telegram Safe Area для iPhone (чтобы контент не уходил под Dynamic Island) */
        .safe-area {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">BONUS CASINO</div>
        <div class="header-sub">Выбирай скорее себе бонус и выигрывай вместе с нами и 100% RTP</div>
    </header>

    <main class="container">
        <div class="game-grid">
            <div class="game-panel">
                <span class="game-name">PANDA</span>
                <button class="bonus-btn">Получить Бонус</button>
            </div>
            <div class="game-panel">
                <span class="game-name">BANDIT</span>
                <button class="bonus-btn">Получить Бонус</button>
            </div>
            <div class="game-panel">
                <span class="game-name">JETTON</span>
                <button class="bonus-btn">Получить Бонус</button>
            </div>
            <div class="game-panel">
                <span class="game-name">LEEBET</span>
                <button class="bonus-btn">Получить Бонус</button>
            </div>
            <div class="game-panel">
                <span class="game-name">APEX</span>
                <button class="bonus-btn">Получить Бонус</button>
            </div>
            <div class="game-panel">
                <span class="game-name">EVA</span>
                <button class="bonus-btn">Получить Бонус</button>
            </div>
        </div>
        <div class="safe-area"></div>
    </main>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Меняем цвет заголовка в самом клиенте Telegram (верхняя полоска)
        tg.MainButton.setText('Продолжить').hide();
        tg.BackButton.show();
        
        // Применяем безопасные области и расширяем фон на весь экран
        tg.expand();
        tg.enableClosingConfirmation();
        
        // Добавляем класс для корректного фона после инициализации
        document.body.classList.add('telegram-app-ready');

        // Логика кнопок (пример)
        document.querySelectorAll('.bonus-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const gameName = btn.previousElementSibling.textContent;
                // Здесь будет ваша логика выдачи бонуса
                tg.HapticFeedback.notificationOccurred('success');
                alert(`Бонус для ${gameName} успешно получен!`);
            });
        });
    </script>
</body>
</html>
