<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP BONUS CASINO</title>
    <style>
        /* Базовые настройки: сброс отступов и шрифта */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0a; /* Темно-черный фон */
            color: #ffffff;
            overflow: hidden; /* Скрываем скролл, так как контент будет в панели */
            display: flex;
        }

        /* Левая панель с логотипом и меню */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            border-right: 1px solid #2a2a2a;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: slideInLeft 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
        }

        /* Анимация появления боковой панели */
        @keyframes slideInLeft {
            from {
                transform: translateX(-50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Логотип */
        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 60px;
            text-align: center;
            text-transform: uppercase;
            animation: glow 2s ease-in-out infinite alternate;
        }

        /* Мерцающая анимация для логотипа */
        @keyframes glow {
            from {
                text-shadow: 0 0 5px #ffd700, 0 0 10px #ffd700;
            }
            to {
                text-shadow: 0 0 15px #ffd700, 0 0 25px #ff8c00;
            }
        }

        /* Список меню */
        .menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            position: relative;
        }

        .menu-link {
            display: block;
            padding: 15px 20px;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Псевдоэлемент для анимации фона при наведении */
        .menu-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: left 0.5s;
        }

        .menu-link:hover {
            color: #ffffff;
            transform: translateX(10px);
        }

        .menu-link:hover::before {
            left: 100%;
        }

        /* Иконки казино (используем системный шрифт, так как реальных логотипов нет) */
        .menu-link span {
            display: inline-block;
            width: 30px;
            margin-right: 12px;
            text-align: center;
        }

        /* Эффект наведения на всю панель */
        .menu-item:hover::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 30px;
            background: linear-gradient(0deg, #ffd700, #ff8c00);
            border-radius: 2px;
            animation: slideRight 0.3s ease-out;
        }

        @keyframes slideRight {
            from {
                width: 0;
            }
            to {
                width: 4px;
            }
        }

        /* Центральный экран */
        .main-screen {
            flex-grow: 1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.03) 0%, transparent 20%),
                #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: fadeInBg 3s ease-in-out infinite alternate;
        }

        @keyframes fadeInBg {
            from { opacity: 0.95; }
            to { opacity: 1; }
        }

        .center-content {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 6vw;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        p {
            font-size: 1.2vw;
            color: #808080;
            max-width: 600px;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            .logo {
                font-size: 18px;
                writing-mode: vertical-rl;
                transform: rotate(180deg);
                margin-bottom: 40px;
            }
            .menu-link {
                padding: 15px;
                font-size: 0;
            }
            .menu-link span {
                margin-right: 0;
            }
            .menu-link:hover {
                transform: translateX(0);
            }
            h1 {
                font-size: 10vw;
            }
            p {
                font-size: 2.5vw;
            }
        }
    </style>
</head>
<body>

    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="logo">VIP BONUS CASINO</div>
        <ul class="menu">
            <li class="menu-item"><a href="#" class="menu-link"><span>🏆</span>1WIN</a></li>
            <li class="menu-item"><a href="#" class="menu-link"><span>💰</span>EZCASH</a></li>
            <li class="menu-item"><a href="#" class="menu-link"><span>🐼</span>PANDA</a></li>
            <li class="menu-item"><a href="#" class="menu-link"><span>🦁</span>APEX</a></li>
            <li class="menu-item"><a href="#" class="menu-link"><span>🎰</span>LEEBET</a></li>
            <li class="menu-item"><a href="#" class="menu-link"><span>🌟</span>EVA</a></li>
            <li class="menu-item"><a href="#" class="menu-link"><span>🎩</span>BANDIT</a></li>
        </ul>
    </div>

    <!-- Центральный экран -->
    <div class="main-screen">
        <div class="center-content">
            <h1>VIP BONUS CASINO</h1>
            <p>Выберите платформу, чтобы получить эксклюзивные бонусы и начать играть.</p>
        </div>
    </div>

</body>
</html>
